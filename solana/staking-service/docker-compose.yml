# Kvasir gateway — public-server deployment.
#
#   cd solana/staking-service
#   cp .env.example .env           # then edit .env (set KVR_PUBLIC_URL etc.)
#   # provide the settlement admin key ONE of two ways:
#   #   (a) file:  mkdir -p secrets && cp ../token/.keys/admin.json secrets/admin.json
#   #   (b) inline: set KVR_ADMIN_KEY=[...] in .env  (then remove the secrets volume below)
#   docker compose up -d --build
#
# Build context is the repo root (../..) so the Dockerfile can reach the web app + token spec.

services:
  gateway:
    build:
      context: ../..
      dockerfile: solana/staking-service/Dockerfile
    image: kvasir-gateway:latest
    container_name: kvasir-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8791}:8791"
    environment:
      PORT: "8791"
      KVR_RPC_URL: "${KVR_RPC_URL:-https://api.devnet.solana.com}"
      # p4 bridge — the HTTP face of the p4 engine. Set P4_BRIDGE_URL to its
      # address to make the pay-inference model list and completions use the
      # models the ring is actually serving. Left empty, the model pool is empty:
      # there is no demo catalogue to fall back to.
      P4_BRIDGE_URL: "${P4_BRIDGE_URL:-}"
      # Shared secret the bridge requires (must match the bridge's P4_BRIDGE_TOKEN).
      P4_BRIDGE_TOKEN: "${P4_BRIDGE_TOKEN:-}"
      # Gateway admin login (Sign-In With Solana + TOTP 2FA) at /admin. Comma-separated
      # admin wallet allowlist; EMPTY => admin surface disabled. KVR_SESSION_SECRET keeps
      # admin sessions valid across restarts (random per-process if unset).
      KVR_ADMIN_WALLETS: "${KVR_ADMIN_WALLETS:-}"
      KVR_SESSION_SECRET: "${KVR_SESSION_SECRET:-}"
      # Operator token-gate: registering/running a node requires the owner wallet to
      # hold >= this many KVR on-chain (0 disables). Should match the hub's value.
      KVR_MIN_OPERATOR_KVR: "${KVR_MIN_OPERATOR_KVR:-0}"
      STAKING_APR: "${STAKING_APR:-0.12}"
      KVR_GATEWAY_BONUS: "${KVR_GATEWAY_BONUS:-1.5}"
      # Infra operator rewards: wallet that owns the headless hub/gateway roles on
      # this host. The gateway auto-registers a node on its behalf (uptime rewards +
      # visibility in that wallet's node monitor). Empty => not reported.
      KVR_INFRA_OWNER: "${KVR_INFRA_OWNER:-}"
      KVR_BRIDGE_OWNER: "${KVR_BRIDGE_OWNER:-}"
      KVR_GATEWAY_OWNER: "${KVR_GATEWAY_OWNER:-}"
      KVR_BRIDGE_UPTIME_PER_HOUR: "${KVR_BRIDGE_UPTIME_PER_HOUR:-2.0}"
      KVR_GATEWAY_UPTIME_PER_HOUR: "${KVR_GATEWAY_UPTIME_PER_HOUR:-1.0}"
      # The canonical URL clients should use (returned by /api/config). e.g. https://gw.example.com
      KVR_PUBLIC_URL: "${KVR_PUBLIC_URL:-}"
      # Credit accounts (API-key path). Without these the service falls back to
      # closed self-registration, so /api/credits/balance answers 401 for every
      # wallet and the app's credit screen cannot recover on its own.
      KVR_CREDIT_OPEN_REGISTER: "${KVR_CREDIT_OPEN_REGISTER:-}"
      KVR_CREDIT_WHITELIST: "${KVR_CREDIT_WHITELIST:-}"
      KVR_CREDIT_MIN_BALANCE: "${KVR_CREDIT_MIN_BALANCE:-0}"
      # Wallets served without a balance (evaluation / partner keys). Scoped to
      # named wallets rather than lowering the minimum, which would make every
      # self-registered wallet free.
      KVR_CREDIT_UNMETERED_WALLETS: "${KVR_CREDIT_UNMETERED_WALLETS:-}"
      # Source addresses an unmetered key may be used from; empty means any.
      KVR_CREDIT_UNMETERED_ALLOW_IPS: "${KVR_CREDIT_UNMETERED_ALLOW_IPS:-}"
      # Inline admin key alternative to the mounted file (leave empty if using the secrets volume).
      KVR_ADMIN_KEY: "${KVR_ADMIN_KEY:-}"
    volumes:
      # persistent settlement state (positions, node registry). A named volume
      # (not a host bind) so it inherits the image's kvasir ownership and the
      # non-root container can write it — a host dir mounts as root:root.
      - gateway-data:/app/data
      # settlement admin key (devnet). Comment this out if you pass KVR_ADMIN_KEY inline instead.
      - ./secrets/admin.json:/run/secrets/admin.json:ro
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8791/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Automatic HTTPS via Let's Encrypt, reverse-proxying to the gateway.
  # Needs a public DNS A record for the domain + ports 80/443 open.
  caddy:
    image: caddy:2
    container_name: kvasir-caddy
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  gateway-data:
  caddy-data:
  caddy-config:

networks:
  default:
  # The linkcpp gateway's external network is gone with linkcpp. Do not add an
  # `external: true` network back unless something still creates it — compose
  # refuses to start the gateway when a declared external network is missing.
  # The p4 bridge is reached over its own URL, not a shared docker network.
