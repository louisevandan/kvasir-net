[package]
name = "p4-hf-adapter"
version = "0.1.0"
edition = "2024"

[dependencies]
p4-adapter = { path = "../../adapter" }
p4-protocol = { path = "../../../protocol" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["rt", "process", "io-util", "sync", "time", "macros"] }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
