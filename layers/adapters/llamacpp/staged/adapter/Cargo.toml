[package]
name = "p4-llamacpp-staged-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
p4-adapter = { path = "../../../adapter" }
p4-protocol = { path = "../../../../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.10.9"

[lib]
path = "src/lib.rs"

[dev-dependencies]
p4-agent-core = { path = "../../../../agent" }
tokio = { version = "1.48.0", features = ["rt", "sync", "time"] }
