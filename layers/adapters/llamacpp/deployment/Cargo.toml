[package]
name = "p4-llamacpp-deployment"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"

[dependencies]
p4-adapter = { path = "../../adapter" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
p4-agent-core = { path = "../../../agent" }
p4-protocol = { path = "../../../protocol" }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time", "macros"] }

[features]
# The five integration tests below drive `apps/llama`'s real v2 submission
# server as a child `node` process. That is a second checkout, not a fixture in
# this repository, so they are off by default and `cargo test --workspace`
# neither builds nor counts them.
#
# They used to run unconditionally and fail on any machine without it - five
# red targets reporting an environment fact. The first repair was a runtime
# `return`, which was worse in a quieter way: libtest counts a body that
# returns early as `passed`, so "839 passed" silently included five that never
# executed. A target that is not built cannot be miscounted.
#
#     cargo test -p p4-llamacpp-deployment --features cross-wire-fixture
cross-wire-fixture = []

[[test]]
name = "agent_relay"
required-features = ["cross-wire-fixture"]

[[test]]
name = "agent_relay_full"
required-features = ["cross-wire-fixture"]

[[test]]
name = "broker_registry"
required-features = ["cross-wire-fixture"]

[[test]]
name = "cross_wire"
required-features = ["cross-wire-fixture"]

[[test]]
name = "reconnect_delivery"
required-features = ["cross-wire-fixture"]
