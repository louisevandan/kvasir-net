[package]
name = "p4-llamacpp-deployment"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
p4-adapter = { path = "../../adapter" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
p4-agent-core = { path = "../../../agent" }
p4-protocol = { path = "../../../protocol" }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time", "macros"] }
