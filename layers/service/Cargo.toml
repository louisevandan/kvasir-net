[package]
name = "p4-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
p4-adapter = { path = "../adapters/adapter" }
p4-agent-core = { path = "../agent" }
p4-protocol = { path = "../protocol" }
tokio = { version = "1.48.0", features = ["rt", "sync", "macros"] }

[dev-dependencies]
p4-mock = { path = "../adapters/mock" }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "net", "time", "macros"] }
