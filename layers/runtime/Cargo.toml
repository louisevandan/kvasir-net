[package]
name = "p4-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
p4-protocol = { path = "../protocol" }
num_cpus = "=1.17.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["net", "rt-multi-thread", "sync", "time", "io-util", "macros"] }
